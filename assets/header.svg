<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Jeff — Code meets motion.</title>
  <desc id="desc">An animated mechanical press illustration beside a personal introduction. Embedded systems, control, and manufacturing. The illustration is decorative.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102a2b"/><stop offset="1" stop-color="#091717"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#b3e9d2" stroke-opacity=".045"/></pattern>
    <linearGradient id="fade"><stop stop-color="#9becbc" stop-opacity="0"/><stop offset="1" stop-color="#9becbc"/></linearGradient>
    <clipPath id="round"><rect width="960" height="360" rx="18"/></clipPath>
    <style>
      .sans{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}
      .ram{animation:press 6s ease-in-out infinite}.signal{stroke-dasharray:8 100;animation:flow 4s linear infinite}
      .cursor{animation:blink 1.2s steps(1) infinite}.ring{transform-origin:728px 169px;animation:turn 24s linear infinite}
      @keyframes press{0%,18%,90%,100%{transform:translateY(0)}40%,66%{transform:translateY(24px)}}
      @keyframes flow{to{stroke-dashoffset:-216}}@keyframes blink{50%{opacity:0}}
      @keyframes turn{to{transform:rotate(360deg)}}
      @media(prefers-reduced-motion:reduce){.ram,.signal,.cursor,.ring{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#round)">
    <rect width="960" height="360" fill="url(#bg)"/>
    <rect width="960" height="360" fill="url(#grid)"/>
    <path d="M48 75H912" stroke="#a2dac1" stroke-opacity=".18"/>
    <circle cx="52" cy="43" r="4" fill="#b9f18a"/>
    <text x="68" y="48" class="mono" font-size="12" letter-spacing="2.2" fill="#d2e0d6">JEFFAAAY / ENGINEERING NOTEBOOK</text>
    <text x="911" y="48" text-anchor="end" class="mono" font-size="11" letter-spacing="1.4" fill="#8aa49b">HARDWARE + SOFTWARE</text>
    <text x="47" y="156" class="sans" font-size="62" font-weight="650" letter-spacing="-2.5" fill="#f3f1e7">Hi, I'm Jeff.</text>
    <text x="48" y="205" class="sans" font-size="33" font-weight="400" letter-spacing="-.8" fill="#b9f18a">Code meets motion.</text>
    <text x="49" y="252" class="sans" font-size="15" fill="#b6c7bc">Embedded systems · Control · Manufacturing</text>
    <text x="49" y="314" class="mono" font-size="12" letter-spacing="1.2" fill="#7e9f90">&gt; DESIGN. BUILD. MEASURE. REFINE.</text>
    <rect x="318" y="302" width="7" height="13" fill="#b9f18a" class="cursor"/>
    <!-- Original mechanical sketch; it is not a model of a specific machine. -->
    <circle cx="728" cy="169" r="104" fill="none" stroke="#b9f18a" stroke-opacity=".08"/>
    <circle cx="728" cy="169" r="121" fill="none" stroke="#b9f18a" stroke-opacity=".13" stroke-dasharray="3 10" class="ring"/>
    <path d="M728 85V278M610 169H845" stroke="#d7f5ce" stroke-opacity=".09" stroke-dasharray="4 7"/>
    <g stroke-linejoin="round">
      <path d="M651 284V112H803V284" fill="none" stroke="#577b6c" stroke-width="12"/>
      <path d="M651 277V112H803V277" fill="none" stroke="#c5d6bc" stroke-width="2"/>
      <rect x="694" y="105" width="66" height="44" rx="7" fill="#203e32" stroke="#a0ba97" stroke-width="2"/>
      <path d="M700 119H754M700 135H754" stroke="#72956c" stroke-width="2"/>
      <g class="ram">
        <path d="M727 149V205" stroke="#b9f18a" stroke-width="8"/>
        <path d="M727 150V202" stroke="#e5ffc9" stroke-width="2"/>
        <rect x="693" y="201" width="68" height="13" rx="3" fill="#b9f18a"/>
        <path d="M704 219H750" stroke="#b9f18a" stroke-opacity=".3" stroke-width="2"/>
      </g>
      <path d="M706 269V252H749V269" fill="#3c5843" stroke="#b3cca2" stroke-width="2"/>
      <rect x="633" y="274" width="190" height="13" rx="4" fill="#314e40" stroke="#95b686" stroke-width="2"/>
      <path d="M651 293V298M803 293V298" stroke="#709263" stroke-width="7"/>
      <path d="M766 127H858V214H815" fill="none" stroke="#668e70" stroke-width="1.5"/>
      <path d="M766 127H858V214H815" fill="none" stroke="#c4ff94" stroke-width="2.5" class="signal"/>
      <rect x="846" y="162" width="24" height="28" rx="4" fill="#13322b" stroke="#88b393"/>
      <path d="M852 180L856 170L860 179L864 171" stroke="#b9f18a" fill="none"/>
      <circle cx="651" cy="112" r="4" fill="#c5d6bc"/>
      <circle cx="803" cy="112" r="4" fill="#c5d6bc"/>
    </g>
    <path d="M613 314H877" stroke="#a3c994" stroke-opacity=".2"/>
    <text x="615" y="332" class="mono" font-size="10" letter-spacing="1.8" fill="#7e9f90">CONCEPT / MOTION STUDY</text>
  </g>
</svg>
