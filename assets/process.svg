<svg xmlns="http://www.w3.org/2000/svg" width="960" height="92" viewBox="0 0 960 92" role="img" aria-labelledby="title">
  <title id="title">Design, build, measure, refine</title>
  <style>
    text{font-family:Consolas,monospace}.flow{stroke-dasharray:18 130;animation:move 10s linear infinite}
