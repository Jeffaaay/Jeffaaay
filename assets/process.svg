  <g stroke="#afcf98" fill="#102723" stroke-width="2"><circle cx="90" cy="29" r="4"/><circle cx="350" cy="29" r="4"/><circle cx="610" cy="29" r="4"/><circle cx="870" cy="29" r="4"/></g>
  <g font-size="12" letter-spacing="1.8" fill="#cfdfc2" text-anchor="middle"><text x="90" y="63">01 DESIGN</text><text x="350" y="63">02 BUILD</text><text x="610" y="63">03 MEASURE</text><text x="870" y="63">04 REFINE</text></g>
