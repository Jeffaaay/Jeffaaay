<svg xmlns="http://www.w3.org/2000/svg" width="960" height="254" viewBox="0 0 960 254" role="img" aria-labelledby="title desc">
  <title id="title">SD700 — Force control, from firmware to feedback</title>
  <desc id="desc">An overview card for SD700: embedded control, Modbus communication, diagnostics, and test tools. The animated signal trace is decorative.</desc>
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#2d5c43" stroke-opacity=".065"/></pattern>
    <clipPath id="scope"><rect x="625" y="64" width="287" height="137" rx="8"/></clipPath>
    <style>
      .sans{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}
      .trace{stroke-dasharray:510;animation:draw 7s ease-in-out infinite}
      @keyframes draw{0%,10%{stroke-dashoffset:510}58%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:-510}}
      @media(prefers-reduced-motion:reduce){.trace{animation:none}}
    </style>
  </defs>
  <rect x="1" y="1" width="958" height="252" rx="16" fill="#f2f4eb" stroke="#d7dfcf"/>
  <text x="35" y="35" class="mono" font-size="10" letter-spacing="2" fill="#536c53">01 / FEATURED REPOSITORY</text>
  <rect x="478" y="20" width="68" height="22" rx="11" fill="#e1e9da"/>
  <circle cx="492" cy="31" r="3" fill="#416b42"/>
  <text x="502" y="35" class="mono" font-size="10" fill="#416b42">PUBLIC</text>
  <text x="33" y="93" class="sans" font-size="50" font-weight="700" letter-spacing="-2" fill="#18392c">SD700</text>
  <text x="35" y="131" class="sans" font-size="21" letter-spacing="-.3" fill="#31533b">Force control, from firmware to feedback.</text>
  <text x="35" y="160" class="sans" font-size="14" fill="#61705b">Embedded control · Diagnostics · Test tools</text>
  <rect x="35" y="190" width="158" height="33" rx="6" fill="#234c35"/>
  <text x="51" y="212" class="sans" font-size="13" font-weight="600" fill="#f5f5eb">View repository</text>
  <path d="M167 209L176 200M167 200H176V209" stroke="#c4ed9f" stroke-width="1.5" fill="none"/>
  <text x="218" y="212" class="mono" font-size="11" fill="#526d4b">C / MODBUS / PYTHON</text>
  <path d="M582 26V228" stroke="#cbd7c0"/>
  <text x="626" y="42" class="mono" font-size="10" letter-spacing="1.4" fill="#617656">SIGNAL / CONCEPT TRACE</text>
  <rect x="625" y="64" width="287" height="137" rx="8" fill="#e7eddf"/>
  <g clip-path="url(#scope)">
    <rect x="625" y="64" width="287" height="137" fill="url(#grid)"/>
    <path d="M640 156H898" fill="none" stroke="#709865" stroke-opacity=".45" stroke-dasharray="4 5"/>
    <path d="M640 176H664C680 176 680 106 694 106S709 166 725 153S744 133 758 143S779 152 792 146S809 147 827 146H898" fill="none" stroke="#97b18a" stroke-width="2.5"/>
    <path d="M640 176H664C680 176 680 106 694 106S709 166 725 153S744 133 758 143S779 152 792 146S809 147 827 146H898" fill="none" stroke="#2c6940" stroke-width="3" stroke-linecap="round" class="trace"/>
  </g>
  <text x="626" y="223" class="mono" font-size="10" letter-spacing=".5" fill="#617656">COMMAND → CONTROL → FEEDBACK</text>
</svg>
