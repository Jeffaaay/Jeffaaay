<svg xmlns="http://www.w3.org/2000/svg" width="480" height="390" viewBox="0 0 480 390" role="img" aria-labelledby="title desc">
  <title id="title">Jeff — Code meets motion.</title>
  <desc id="desc">Embedded systems, control, and manufacturing. Animated mechanical illustration.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102a2b"/><stop offset="1" stop-color="#091717"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#b3e9d2" stroke-opacity=".045"/></pattern>
    <clipPath id="round"><rect width="480" height="390" rx="18"/></clipPath>
    <clipPath id="ramTravel"><rect x="110" y="59" width="70" height="103"/></clipPath>
    <style>
      .sans{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}
      .ram{animation:press 6s ease-in-out infinite}.signal{stroke-dasharray:8 100;animation:flow 4s linear infinite}
      @keyframes press{0%,18%,90%,100%{transform:translateY(0)}40%,66%{transform:translateY(18px)}}
      @keyframes flow{to{stroke-dashoffset:-216}}
      @media(prefers-reduced-motion:reduce){.ram,.signal{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#round)">
    <rect width="480" height="390" fill="url(#bg)"/>
    <rect width="480" height="390" fill="url(#grid)"/>
    <circle cx="29" cy="32" r="4" fill="#b9f18a"/>
    <text x="44" y="37" class="mono" font-size="12" letter-spacing="2" fill="#d2e0d6">JEFFAAAY / ENGINEERING</text>
    <path d="M26 58H454" stroke="#a2dac1" stroke-opacity=".18"/>
    <text x="24" y="120" class="sans" font-size="51" font-weight="650" letter-spacing="-2" fill="#f3f1e7">Hi, I'm Jeff.</text>
    <text x="26" y="164" class="sans" font-size="32" letter-spacing="-.8" fill="#b9f18a">Code meets motion.</text>
    <text x="27" y="197" class="sans" font-size="14" fill="#b6c7bc">Embedded systems · Control · Manufacturing</text>
    <text x="27" y="264" class="mono" font-size="13" letter-spacing="1.5" fill="#9bbda8">SOFTWARE</text>
    <path d="M29 282H110" stroke="#5e8770"/><path d="M106 278L110 282L106 286" fill="none" stroke="#b9f18a"/>
    <text x="27" y="312" class="mono" font-size="13" letter-spacing="1.5" fill="#9bbda8">HARDWARE</text>
    <g transform="translate(203 202) scale(.75)">
      <circle cx="145" cy="98" r="97" fill="none" stroke="#b9f18a" stroke-opacity=".1" stroke-dasharray="3 10"/>
      <path d="M76 180V28H212V180" fill="none" stroke="#577b6c" stroke-width="11"/>
      <path d="M76 180V28H212V180" fill="none" stroke="#c5d6bc" stroke-width="2"/>
      <rect x="115" y="22" width="58" height="37" rx="6" fill="#203e32" stroke="#a0ba97" stroke-width="2"/>
      <path d="M122 32H166M122 48H166" stroke="#72956c" stroke-width="2"/>
      <g clip-path="url(#ramTravel)"><g class="ram"><path d="M144 41V114" stroke="#b9f18a" stroke-width="8"/><rect x="115" y="114" width="58" height="12" rx="3" fill="#b9f18a"/></g></g>
      <path d="M126 177V162H163V177" fill="#3c5843" stroke="#b3cca2" stroke-width="2"/>
      <rect x="59" y="177" width="170" height="13" rx="4" fill="#314e40" stroke="#95b686" stroke-width="2"/>
      <path d="M178 42H256V129H223" fill="none" stroke="#668e70" stroke-width="1.5"/>
      <path d="M178 42H256V129H223" fill="none" stroke="#c4ff94" stroke-width="2.5" class="signal"/>
    </g>
    <text x="27" y="365" class="mono" font-size="10" letter-spacing="1" fill="#7e9f90">DESIGN. BUILD. MEASURE. REFINE.</text>
  </g>
</svg>
